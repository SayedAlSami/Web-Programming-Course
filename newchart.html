
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Births and Deaths in Finland</title>

  <script src="https://unpkg.com/frappe-charts@latest/dist/frappe-charts.min.umd.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      color: #222;
    }

    #chart {
      width: 100%;
      min-height: 450px;
    }

    #status {
      margin: 8px 0;
      color: #555;
    }

    button {
      font: inherit;
      padding: 5px 8px;
    }
  </style>
</head>

<body>
  <h1>Births and deaths</h1>

  <p id="status" role="status">
    Loading birth and death data...
  </p>

  <div id="chart" aria-label="Births and deaths bar chart"></div>

  <button id="navigation" type="button">Go back</button>

  <script>
    "use strict";

    const API_URL =
      "https://statfin.stat.fi/PxWeb/api/v1/en/StatFin/synt/12dy.px";

    const FIRST_YEAR = 2000;
    const LAST_YEAR = 2021;
    const COUNTRY_CODE = "SSS";
    const COUNTRY_NAME = "whole country";

    function getYearValues() {
      const years = [];

      for (
        let year = FIRST_YEAR;
        year <= LAST_YEAR;
        year++
      ) {
        years.push(String(year));
      }

      return years;
    }

    function buildRequest(areaCode, contentCode) {
      return {
        query: [
          {
            code: "timeperiod_y",
            selection: {
              filter: "item",
              values: getYearValues()
            }
          },
          {
            code: "alue_23_20260101",
            selection: {
              filter: "item",
              values: [areaCode]
            }
          },
          {
            code: "contentscode",
            selection: {
              filter: "item",
              values: [contentCode]
            }
          }
        ],
        response: {
          format: "json-stat2"
        }
      };
    }

    async function fetchSeries(areaCode, contentCode) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(
          buildRequest(areaCode, contentCode)
        )
      });

      if (!response.ok) {
        throw new Error(
          "A birth or death data request failed. Please try again."
        );
      }

      const result = await response.json();
    


      if (!Array.isArray(result.value)) {
        throw new Error(
          "The API response did not contain the requested data."
        );
      }

      return result.value.map(value =>
        value === null ? 0 : Number(value)
      );
    }


function drawChart(labels, births, deaths, areaName) {
  document.getElementById("chart").innerHTML = "";

  new frappe.Chart("#chart", {
    title: "Births and deaths in " + areaName,

    data: {
      labels: labels,
      datasets: [
        {
          name: "Births",
          values: labels.map((year, index) => births[index])
        },
        {
          name: "Deaths",
          values: labels.map((year, index) => deaths[index])
        }
      ]
    },

    type: "bar",
    height: 450,
    colors: ["#63d0ff", "#363636"],

    axisOptions: {
      xAxisMode: "tick",
      yAxisMode: "span",
      xIsSeries: true
    },

    barOptions: {
      spaceRatio: 0.15,
      stacked: false
    }
  });
}


    async function initialize() {
      const status = document.getElementById("status");

      // Read the municipality selected on index.html.
      const areaCode =
        sessionStorage.getItem("selectedAreaCode") ||
        COUNTRY_CODE;

      const areaName =
        sessionStorage.getItem("selectedAreaName") ||
        COUNTRY_NAME;

      try {
        // First POST request: fetch birth data.
        const births = await fetchSeries(
          areaCode,
          "synt-vm01"
        );

        // Second POST request: fetch death data separately.
        const deaths = await fetchSeries(
          areaCode,
          "synt-vm11"
        );

        drawChart(
          getYearValues(),
          births,
          deaths,
          areaName
        );

        status.textContent =
          "Showing births and deaths for " + areaName + ".";

      } catch (error) {
        status.textContent = error.message;
      }
    }

    document
      .getElementById("navigation")
      .addEventListener("click", function() {
        window.location.href = "index.html";
      });

    initialize();
  </script>
</body>
</html>
